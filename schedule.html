<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - 絵恋空 Official Site</title>
    
    <!-- フォントの読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&family=Rampart+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="back-to-top.css">
    
    <style>
        /* ========================================
           全体設定（トップページと共通）
           ======================================== */
        body { 
            margin: 0; 
            font-family: 'M PLUS Rounded 1c', sans-serif; 
            color: #333; 
            overflow-x: hidden;
            background-color: #f0f8fa; 
            background-image: radial-gradient(#bce4f0 2px, transparent 2px); 
            background-size: 20px 20px; 
        }

        /* ========================================
           コンテンツエリア（ページの中身を囲む箱）
           ======================================== */
        .container { 
            max-width: 800px; 
            margin: 80px auto 50px; /* 上に少し多めの余白（アイコンと被らないため） */
            padding: 0 20px; 
        }

        .page-content {
            background: rgba(255, 255, 255, 0.9); /* 少し透ける白背景で可愛く */
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }

        /* ページタイトルのデザイン */
        h1.page-title {
            font-family: 'Rampart One', sans-serif;
            text-align: center;
            font-size: 3rem;
            color: #ff9fb5;
            margin-top: 0;
            margin-bottom: 30px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .site-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px 14px;
            margin: 28px auto 40px;
            padding: 0 20px;
            color: #999;
            text-align: center;
            font-size: .72rem;
            line-height: 1.6;
        }

        .site-footer a { margin-right: 14px; color: #d86682; }

        .content-section + .content-section {
            margin-top: 48px;
        }

        .section-title {
            font-family: 'Rampart One', sans-serif;
            font-size: 2rem;
            color: #ff9fb5;
            margin: 0 0 18px;
            padding-bottom: 8px;
            border-bottom: 2px dashed #ffd1dc;
        }

        .empty-message {
            margin: 0;
            padding: 22px;
            text-align: center;
            color: #777;
            background: #fff8fa;
            border-radius: 10px;
        }

        .schedule-detail {
            padding: 20px;
            margin-bottom: 16px;
            background: #fff;
            border-left: 5px solid #ff9fb5;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .schedule-detail time {
            display: block;
            margin-bottom: 6px;
            color: #e9829a;
            font-weight: 700;
        }

        .schedule-detail h3 {
            margin: 0 0 10px;
        }

        .schedule-detail p {
            margin: 0;
            line-height: 1.8;
        }

        .schedule-detail a {
            display: inline-block;
            margin-top: 12px;
            color: #d86682;
            font-weight: 700;
        }

        .calendar-title {
            margin: 28px 0 12px;
            font-size: 1.2rem;
        }

        /* ========================================
           ハンバーガーメニュー（トップページと完全に同じ）
           ======================================== */
        .hamburger-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
        }

        #menu-toggle { display: none; }

        .custom-menu-icon {
            display: block;
            width: 200px;  
            height: 200px;
            cursor: pointer;
            z-index: 1000;
            position: relative;
        }

        .custom-menu-icon img {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: all 0.3s ease;
        }

        .icon-close {
            opacity: 0;
            transform: scale(0.5) rotate(-45deg);
        }

        #menu-toggle:checked ~ .custom-menu-icon .icon-open {
            opacity: 0;
            transform: scale(0.5) rotate(45deg);
        }

        #menu-toggle:checked ~ .custom-menu-icon .icon-close {
            opacity: 1;
            transform: scale(1) rotate(0);
        }

        .menu-content {
            position: fixed;
            top: 0;
            right: -100%;
            width: 250px;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
            transition: all 0.3s;
            padding-top: 220px; 
        }

        .menu-content ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu-content li {
            text-align: center;
            border-bottom: 1px dashed #ccc;
        }

        .menu-content a {
            display: block;
            padding: 20px;
            text-decoration: none;
            color: #333;
            font-family: 'Rampart One', sans-serif;
            font-size: 1.5rem;
            transition: background 0.3s, color 0.3s;
        }

        .menu-content a:hover {
            background-color: #ffd1dc;
            color: white;
        }

        #menu-toggle:checked ~ .menu-content {
            right: 0;
        }

    @media screen and (max-width: 900px) {
        .custom-menu-icon {
            width: 100px;  /* スマホでの幅（好みのサイズに調整してください） */
            height: 100px; /* 幅と同じ数値にします */
        }
    
        /* ↓追加：アイコンに合わせてメニュー内の上の隙間も少し狭くする */
        .menu-content {
            padding-top: 120px; 
        }
    }

    /* --- APIで取得した予定を囲む枠の設定 --- */
.calendar-wrapper {
  position: relative;
  width: 100%;
  max-width: 1000px;
  border: 4px solid #ff9fb5;
  margin: 0 auto;
  border-radius: 10px;
  padding: 18px;
  box-sizing: border-box;
  background: rgba(255, 255, 255, .78);
}

.calendar-note {
  margin: -4px 0 14px;
  color: #888;
  font-size: .85rem;
  text-align: center;
}

.calendar-status {
  margin: 10px 0;
  padding: 20px;
  color: #777;
  text-align: center;
  background: #fff8fa;
  border-radius: 10px;
}

.calendar-events {
  display: grid;
  gap: 12px;
}

.calendar-event {
  padding: 18px;
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.calendar-event time {
  display: block;
  margin-bottom: 6px;
  color: #e9829a;
  font-weight: 700;
}

.calendar-event h4 {
  margin: 0 0 8px;
  font-size: 1.08rem;
}

.calendar-event p {
  margin: 0;
  line-height: 1.8;
  white-space: pre-wrap;
}

.calendar-event-location {
  margin-top: 8px !important;
  color: #777;
  font-size: .9rem;
}

.calendar-event-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.calendar-event-links a {
  display: inline-block;
  padding: 7px 12px;
  color: #fff;
  background: #d86682;
  border-radius: 999px;
  font-size: .85rem;
  font-weight: 700;
  text-decoration: none;
}

.calendar-event-links a:hover {
  background: #be536f;
}

.calendar-add-link {
  display: inline-block;
  margin-top: 14px;
  padding: 7px 12px;
  color: #d86682;
  border: 1px solid #f0a5b6;
  border-radius: 999px;
  font-size: .85rem;
  font-weight: 700;
  text-decoration: none;
}

.calendar-add-link:hover {
  color: #fff;
  background: #d86682;
}

/* --- スマホ画面（幅768px以下）の調整 --- */
@media (max-width: 768px) {
  .page-content {
    padding: 28px 18px;
  }

  h1.page-title {
    font-size: 2.3rem;
  }

  .calendar-wrapper {
    padding: 12px;
  }
}
    </style>
</head>
<body>

    <!-- 右上の固定ハンバーガーメニュー（全ページ共通） -->
    <div class="hamburger-menu">
        <input type="checkbox" id="menu-toggle">
        
        <label for="menu-toggle" class="custom-menu-icon">
            <img src="open.png" class="icon-open" alt="メニュー">
            <img src="close.png" class="icon-close" alt="閉じる">
        </label>
        
        <nav class="menu-content">
            <ul>
                <!-- トップページに戻るリンクを追加しておくと便利です -->
                <li><a href="index.html">Home</a></li> 
                <li><a href="profile.html">Profile</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="work.html">Works</a></li>
                <li><a href="links.html">Official Links</a></li>
            </ul>
        </nav>
    </div>

    <!-- ページの中身エリア -->
    <div class="container">
        <div class="page-content">
            
            <!-- ここから自由にページの中身を書いていきます -->
            <h1 class="page-title">Schedule</h1>

            <section class="content-section" aria-labelledby="schedule-title">
                <h2 id="schedule-title" class="section-title">Schedule</h2>

                <div class="schedule-details">
                    <p class="empty-message">現在、新しいお知らせはありません。</p>

                    <!-- 更新用テンプレート：予定を追加するときは、このコメント内をコピーしてください。
                    <article class="schedule-detail">
                        <time datetime="2026-09-05T21:00">2026.09.05 21:00〜</time>
                        <h3>配信・イベントのタイトル</h3>
                        <p>ここに配信やイベントの詳しい内容を書きます。</p>
                        必要な予定だけ、次のリンクを追加します。
                        <a href="リンク先URL" target="_blank" rel="noopener noreferrer">詳細・お申し込みはこちら</a>
                    </article>
                    -->
                </div>

                <h3 class="calendar-title">Calendar</h3>
                <p class="calendar-note">公開カレンダーから最新の予定を表示しています。</p>
                <div class="calendar-wrapper">
                    <p class="calendar-status" data-calendar-status>予定を読み込んでいます…</p>
                    <div class="calendar-events" data-calendar-events></div>
                </div>
            </section>
            <!-- ここまで -->

        </div>
    </div>

    <footer class="site-footer">
        <a href="site-info.html">サイト情報・広告について</a>
        <span>R-18・18歳未満閲覧禁止</span>
        <span>アフィリエイト広告を含みます</span>
        <span>© 絵恋空 Official Site</span>
    </footer>

    <script>
        (() => {
            const status = document.querySelector('[data-calendar-status]');
            const eventList = document.querySelector('[data-calendar-events]');
            if (!status || !eventList) return;

            if (window.location.protocol === 'file:') {
                status.textContent = '公開サイトでカレンダーを表示します。';
                return;
            }

            fetch('/api/schedule', { headers: { Accept: 'application/json' } })
                .then((response) => {
                    if (!response.ok) throw new Error(`calendar request failed: ${response.status}`);
                    return response.json();
                })
                .then((data) => {
                    const events = Array.isArray(data.events) ? data.events : [];
                    status.remove();
                    if (!events.length) {
                        eventList.innerHTML = '<p class="empty-message">現在、予定はありません。</p>';
                        return;
                    }
                    events.forEach((event) => eventList.appendChild(renderEvent(event)));
                })
                .catch((error) => {
                    console.error(error);
                    status.textContent = 'カレンダーを読み込めませんでした。しばらくしてから再度お試しください。';
                });

            function renderEvent(event) {
                const article = document.createElement('article');
                article.className = 'calendar-event';

                const time = document.createElement('time');
                time.dateTime = event.start?.dateTime || event.start?.date || '';
                time.textContent = formatEventDate(event);
                article.appendChild(time);

                const title = document.createElement('h4');
                title.textContent = event.summary || '予定';
                article.appendChild(title);

                if (event.description) {
                    const description = document.createElement('p');
                    const links = extractUrls(event.description);
                    description.textContent = links.reduce(
                        (text, url) => text.replace(url, ''),
                        event.description,
                    ).trim();
                    if (description.textContent) article.appendChild(description);

                    if (links.length) {
                        const linkList = document.createElement('div');
                        linkList.className = 'calendar-event-links';
                        links.forEach((url, index) => {
                            const label = links.length > 1 ? `詳細リンク${index + 1}` : '詳細リンク';
                            linkList.appendChild(createExternalLink(url, label));
                        });
                        article.appendChild(linkList);
                    }
                }

                if (event.location) {
                    const location = document.createElement('p');
                    location.className = 'calendar-event-location';
                    location.textContent = `場所：${event.location}`;
                    article.appendChild(location);
                }

                // Googleのコピー機能ではなく、閲覧者自身が新規予定を作るテンプレートです。
                // そのため、このサイトのカレンダー所有者やメールは追加されません。
                const addLink = createExternalLink(createGoogleTemplateUrl(event), '自分のカレンダーに追加');
                addLink.classList.add('calendar-add-link');
                article.appendChild(addLink);

                return article;
            }

            function extractUrls(text) {
                return [...new Set((text.match(/https?:\/\/[^\s<>"']+/g) || [])
                    .map((url) => url.replace(/[。、，,）)]+$/g, ''))
                    .filter(isHttpUrl))];
            }

            function createExternalLink(url, label) {
                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = label;
                return link;
            }

            function isHttpUrl(value) {
                try {
                    const url = new URL(value);
                    return url.protocol === 'https:' || url.protocol === 'http:';
                } catch (_) {
                    return false;
                }
            }

            function formatEventDate(event) {
                const start = event.start || {};
                const end = event.end || {};
                if (start.date) {
                    const startText = formatDateOnly(start.date);
                    const endText = end.date ? formatDateOnly(end.date, true) : '';
                    return endText && endText !== startText ? `${startText}〜${endText}` : startText;
                }

                const startDate = new Date(start.dateTime);
                const endDate = end.dateTime ? new Date(end.dateTime) : null;
                if (Number.isNaN(startDate.getTime())) return '日時未定';
                const dateText = new Intl.DateTimeFormat('ja-JP', {
                    timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', weekday: 'short',
                }).format(startDate);
                const startTime = new Intl.DateTimeFormat('ja-JP', {
                    timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit',
                }).format(startDate);
                const endTime = endDate && !Number.isNaN(endDate.getTime())
                    ? new Intl.DateTimeFormat('ja-JP', {
                        timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit',
                    }).format(endDate)
                    : '';
                return `${dateText} ${startTime}${endTime ? `〜${endTime}` : '〜'}`;
            }

            function formatDateOnly(value, exclusiveEnd = false) {
                const date = new Date(`${value}T00:00:00+09:00`);
                if (exclusiveEnd) date.setDate(date.getDate() - 1);
                return new Intl.DateTimeFormat('ja-JP', {
                    timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', weekday: 'short',
                }).format(date);
            }

            function createGoogleTemplateUrl(event) {
                const params = new URLSearchParams({
                    action: 'TEMPLATE',
                    text: event.summary || '絵恋空の予定',
                    dates: `${toGoogleDate(event.start)}/${toGoogleDate(event.end)}`,
                    ctz: 'Asia/Tokyo',
                });
                if (event.description) params.set('details', event.description);
                if (event.location) params.set('location', event.location);
                return `https://calendar.google.com/calendar/render?${params.toString()}`;
            }

            function toGoogleDate(value) {
                if (!value) return '';
                if (value.date) return value.date.replace(/-/g, '');
                const date = new Date(value.dateTime);
                return date.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
            }
        })();
    </script>

    <button class="back-to-top" type="button" aria-label="ページ上部へ戻る" title="ページ上部へ戻る">
        <span aria-hidden="true">↑</span>
    </button>
    <script src="back-to-top.js"></script>

</body>
</html>
