<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - 絵恋空 Official Site</title>
    
    <!-- フォントの読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&family=Rampart+One&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================
           全体設定（トップページと共通）
           ======================================== */
        body { 
            margin: 0; 
            font-family: 'M PLUS Rounded 1c', sans-serif; 
            color: #333; 
            overflow-x: hidden;
            background-color: #f0f8fa; 
            background-image: radial-gradient(#bce4f0 2px, transparent 2px); 
            background-size: 20px 20px; 
        }

        /* ========================================
           コンテンツエリア（ページの中身を囲む箱）
           ======================================== */
        .container { 
            max-width: 800px; 
            margin: 80px auto 50px; /* 上に少し多めの余白（アイコンと被らないため） */
            padding: 0 20px; 
        }

        .page-content {
            background: rgba(255, 255, 255, 0.9); /* 少し透ける白背景で可愛く */
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }

        /* ページタイトルのデザイン */
        h1.page-title {
            font-family: 'Rampart One', sans-serif;
            text-align: center;
            font-size: 3rem;
            color: #ff9fb5;
            margin-top: 0;
            margin-bottom: 30px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .content-section + .content-section {
            margin-top: 48px;
        }

        .section-title {
            font-family: 'Rampart One', sans-serif;
            font-size: 2rem;
            color: #ff9fb5;
            margin: 0 0 18px;
            padding-bottom: 8px;
            border-bottom: 2px dashed #ffd1dc;
        }

        .empty-message {
            margin: 0;
            padding: 22px;
            text-align: center;
            color: #777;
            background: #fff8fa;
            border-radius: 10px;
        }

        .schedule-detail {
            padding: 20px;
            margin-bottom: 16px;
            background: #fff;
            border-left: 5px solid #ff9fb5;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .schedule-detail time {
            display: block;
            margin-bottom: 6px;
            color: #e9829a;
            font-weight: 700;
        }

        .schedule-detail h3 {
            margin: 0 0 10px;
        }

        .schedule-detail p {
            margin: 0;
            line-height: 1.8;
        }

        .schedule-detail a {
            display: inline-block;
            margin-top: 12px;
            color: #d86682;
            font-weight: 700;
        }

        .calendar-title {
            margin: 28px 0 12px;
            font-size: 1.2rem;
        }

        /* ========================================
           ハンバーガーメニュー（トップページと完全に同じ）
           ======================================== */
        .hamburger-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
        }

        #menu-toggle { display: none; }

        .custom-menu-icon {
            display: block;
            width: 200px;  
            height: 200px;
            cursor: pointer;
            z-index: 1000;
            position: relative;
        }

        .custom-menu-icon img {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: all 0.3s ease;
        }

        .icon-close {
            opacity: 0;
            transform: scale(0.5) rotate(-45deg);
        }

        #menu-toggle:checked ~ .custom-menu-icon .icon-open {
            opacity: 0;
            transform: scale(0.5) rotate(45deg);
        }

        #menu-toggle:checked ~ .custom-menu-icon .icon-close {
            opacity: 1;
            transform: scale(1) rotate(0);
        }

        .menu-content {
            position: fixed;
            top: 0;
            right: -100%;
            width: 250px;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
            transition: all 0.3s;
            padding-top: 220px; 
        }

        .menu-content ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu-content li {
            text-align: center;
            border-bottom: 1px dashed #ccc;
        }

        .menu-content a {
            display: block;
            padding: 20px;
            text-decoration: none;
            color: #333;
            font-family: 'Rampart One', sans-serif;
            font-size: 1.5rem;
            transition: background 0.3s, color 0.3s;
        }

        .menu-content a:hover {
            background-color: #ffd1dc;
            color: white;
        }

        #menu-toggle:checked ~ .menu-content {
            right: 0;
        }

    @media screen and (max-width: 900px) {
        .custom-menu-icon {
            width: 100px;  /* スマホでの幅（好みのサイズに調整してください） */
            height: 100px; /* 幅と同じ数値にします */
        }
    
        /* ↓追加：アイコンに合わせてメニュー内の上の隙間も少し狭くする */
        .menu-content {
            padding-top: 120px; 
        }
    }

    /* --- カレンダーを囲む枠の設定 --- */
.calendar-wrapper {
  position: relative;
  width: 100%;
  max-width: 1000px;
  border: 4px solid #ff9fb5; /* ← ★これを変更！ピンクの枠線をつけます */ /* 最大幅。サイトのデザインに合わせて調整してください */
  margin: 0 auto;    /* 中央寄せ */
  border-radius: 10px; /* ←これを追加！ 角が少し丸くなります */
}

/* --- iframe本体の設定 --- */
.calendar-wrapper iframe {
  width: 100% !important;  /* HTML側のwidth指定を上書きして100%にする */
  height: 600px;           /* PC表示時の基本の高さ */
  border: none;            /* 枠線を消す */
  border-radius: 10px; /* ←これを追加！ 角が少し丸くなります */
  display: block; /* ← ★これを追加！隙間が消えます */
}

/* --- スマホ画面（幅768px以下）の調整 --- */
@media (max-width: 768px) {
  .page-content {
    padding: 28px 18px;
  }

  h1.page-title {
    font-size: 2.3rem;
  }

  .calendar-wrapper iframe {
    height: 400px; /* スマホで長すぎず、予定が潰れない絶妙な高さに調整 */
  }
}
    </style>
</head>
<body>

    <!-- 右上の固定ハンバーガーメニュー（全ページ共通） -->
    <div class="hamburger-menu">
        <input type="checkbox" id="menu-toggle">
        
        <label for="menu-toggle" class="custom-menu-icon">
            <img src="open.png" class="icon-open" alt="メニュー">
            <img src="close.png" class="icon-close" alt="閉じる">
        </label>
        
        <nav class="menu-content">
            <ul>
                <!-- トップページに戻るリンクを追加しておくと便利です -->
                <li><a href="index.html">Home</a></li> 
                <li><a href="profile.html">Profile</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="works.html">Works</a></li>
                <li><a href="links.html">Official Links</a></li>
            </ul>
        </nav>
    </div>

    <!-- ページの中身エリア -->
    <div class="container">
        <div class="page-content">
            
            <!-- ここから自由にページの中身を書いていきます -->
            <h1 class="page-title">Schedule</h1>

            <section class="content-section" aria-labelledby="schedule-title">
                <h2 id="schedule-title" class="section-title">Schedule</h2>

                <div class="schedule-details">
                    <p class="empty-message">現在、新しいお知らせはありません。</p>

                    <!-- 更新用テンプレート：予定を追加するときは、このコメント内をコピーしてください。
                    <article class="schedule-detail">
                        <time datetime="2026-09-05T21:00">2026.09.05 21:00〜</time>
                        <h3>配信・イベントのタイトル</h3>
                        <p>ここに配信やイベントの詳しい内容を書きます。</p>
                        必要な予定だけ、次のリンクを追加します。
                        <a href="リンク先URL" target="_blank" rel="noopener noreferrer">詳細・お申し込みはこちら</a>
                    </article>
                    -->
                </div>

                <h3 class="calendar-title">Calendar</h3>
                <div class="calendar-wrapper">
                    <iframe title="絵恋空の公開スケジュール" src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Asia%2FTokyo&showPrint=0&src=M2NlODY5MzM2NjMxZWNiNjdkMDc4ODM2ZjVmNzQ1YjA1ZmVjZTAyMTRiODNhMWVlYWE0OTZiZWEwZjRmMTVjMUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=amEuamFwYW5lc2UjaG9saWRheUBncm91cC52LmNhbGVuZGFyLmdvb2dsZS5jb20&color=%23039be5&color=%230b8043" style="border: solid 1px #777" width="800" height="600" frameborder="0" scrolling="no"></iframe>
                </div>
            </section>
            <!-- ここまで -->

        </div>
    </div>

</body>
</html>
