<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Links - 絵恋空 Official Site</title>
    
    <!-- フォントの読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&family=Rampart+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="back-to-top.css">
    
    <style>
        /* ========================================
           全体設定（トップページと共通）
           ======================================== */
        body { 
            margin: 0; 
            font-family: 'M PLUS Rounded 1c', sans-serif; 
            color: #333; 
            overflow-x: hidden;
            background-color: #f0f8fa; 
            background-image: radial-gradient(#bce4f0 2px, transparent 2px); 
            background-size: 20px 20px; 
        }

        /* ========================================
           コンテンツエリア（ページの中身を囲む箱）
           ======================================== */
        .container { 
            max-width: 800px; 
            margin: 80px auto 50px; /* 上に少し多めの余白（アイコンと被らないため） */
            padding: 0 20px; 
        }

        .page-content {
            background: rgba(255, 255, 255, 0.9); /* 少し透ける白背景で可愛く */
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }

        /* ページタイトルのデザイン */
        h1.page-title {
            font-family: 'Rampart One', sans-serif;
            text-align: center;
            font-size: 3rem;
            color: #ff9fb5;
            margin-top: 0;
            margin-bottom: 30px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .site-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px 14px;
            margin: 28px auto 40px;
            padding: 0 20px;
            color: #999;
            text-align: center;
            font-size: .72rem;
            line-height: 1.6;
        }

        .site-footer a { margin-right: 14px; color: #d86682; }

        .links-intro {
            margin: -10px 0 28px;
            color: #666;
            line-height: 1.8;
            text-align: center;
        }

        .official-links {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .official-link {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #333;
            background: #fff8fa;
            border: 2px solid #ffd1dc;
            border-radius: 14px;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .link-image {
            display: block;
            width: 100%;
            aspect-ratio: 3 / 1;
            object-fit: cover;
        }

        .link-image-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            aspect-ratio: 3 / 1;
            color: #fff;
            background: linear-gradient(135deg, #ff9fb5, #9ecfe0);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: .08em;
        }

        .link-content {
            display: flex;
            flex: 1;
            flex-direction: column;
            justify-content: center;
            min-height: 76px;
            padding: 16px 18px;
        }

        .official-link:hover {
            transform: translateY(-3px);
            background: #fff;
            box-shadow: 0 6px 16px rgba(255, 159, 181, 0.25);
        }

        .link-name {
            color: #e66f8b;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .link-description {
            margin-top: 7px;
            color: #777;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* ========================================
           ハンバーガーメニュー（トップページと完全に同じ）
           ======================================== */
        .hamburger-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
        }

        #menu-toggle { display: none; }

        .custom-menu-icon {
            display: block;
            width: 200px;  
            height: 200px;
            cursor: pointer;
            z-index: 1000;
            position: relative;
        }

        .custom-menu-icon img {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: all 0.3s ease;
        }

        .icon-close {
            opacity: 0;
            transform: scale(0.5) rotate(-45deg);
        }

        #menu-toggle:checked ~ .custom-menu-icon .icon-open {
            opacity: 0;
            transform: scale(0.5) rotate(45deg);
        }

        #menu-toggle:checked ~ .custom-menu-icon .icon-close {
            opacity: 1;
            transform: scale(1) rotate(0);
        }

        .menu-content {
            position: fixed;
            top: 0;
            right: -100%;
            width: 250px;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
            transition: all 0.3s;
            padding-top: 220px; 
        }

        .menu-content ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu-content li {
            text-align: center;
            border-bottom: 1px dashed #ccc;
        }

        .menu-content a {
            display: block;
            padding: 20px;
            text-decoration: none;
            color: #333;
            font-family: 'Rampart One', sans-serif;
            font-size: 1.5rem;
            transition: background 0.3s, color 0.3s;
        }

        .menu-content a:hover {
            background-color: #ffd1dc;
            color: white;
        }

        #menu-toggle:checked ~ .menu-content {
            right: 0;
        }

@media screen and (max-width: 900px) {
    .custom-menu-icon {
        width: 100px;  /* スマホでの幅（好みのサイズに調整してください） */
        height: 100px; /* 幅と同じ数値にします */
    }
    
    /* ↓追加：アイコンに合わせてメニュー内の上の隙間も少し狭くする */
    .menu-content {
        padding-top: 120px; 
    }

    .page-content {
        padding: 30px 18px;
    }

    h1.page-title {
        font-size: 2.3rem;
    }

    .official-links {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>
<body>

    <!-- 右上の固定ハンバーガーメニュー（全ページ共通） -->
    <div class="hamburger-menu">
        <input type="checkbox" id="menu-toggle">
        
        <label for="menu-toggle" class="custom-menu-icon">
            <img src="open.png" class="icon-open" alt="メニュー">
            <img src="close.png" class="icon-close" alt="閉じる">
        </label>
        
        <nav class="menu-content">
            <ul>
                <!-- トップページに戻るリンクを追加しておくと便利です -->
                <li><a href="index.html">Home</a></li> 
                <li><a href="profile.html">Profile</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="https://video.dmm.co.jp/av/list/?actress=1096339" target="_blank" rel="noopener noreferrer">Works</a></li>
                <li><a href="links.html">Official Links</a></li>
            </ul>
        </nav>
    </div>

    <!-- ページの中身エリア -->
    <div class="container">
        <div class="page-content">
            
            <!-- ここから自由にページの中身を書いていきます -->
            <h1 class="page-title">Official Links</h1>
            <p class="links-intro">絵恋空の公式アカウント・関連ページはこちら</p>

            <div class="official-links">
                <a href="https://erensora.fanbox.cc/" class="official-link" target="_blank" rel="noopener noreferrer">
                    <img src="fanbox.png" class="link-image" alt="PIXIV FANBOX">
                    <span class="link-content">
                        <span class="link-name">PIXIV FANBOX</span>
                        <span class="link-description">オフィシャルファンクラブ</span>
                    </span>
                </a>
                <a href="https://x.com/eren_cmore" class="official-link" target="_blank" rel="noopener noreferrer">
                    <img src="twitter.png" class="link-image" alt="サービス名">
                    <span class="link-content">
                        <span class="link-name">TWITTER</span>
                        <span class="link-description">空の日常</span>
                    </span>
                </a>
                <a href="https://www.youtube.com/@erensora" class="official-link" target="_blank" rel="noopener noreferrer">
                    <div class="link-image-placeholder" aria-label="YouTube">YouTube</div>
                    <span class="link-content">
                        <span class="link-name">YouTube</span>
                        <span class="link-description">動画投稿頑張り中</span>
                    </span>
                </a>
                <a href="https://www.instagram.com/erensora_official" class="official-link" target="_blank" rel="noopener noreferrer">
                    <div class="link-image-placeholder" aria-label="Instagram">Instagram</div>
                    <span class="link-content">
                        <span class="link-name">Instagram</span>
                        <span class="link-description">公式写真・日常</span>
                    </span>
                </a>
                <a href="https://www.tiktok.com/@erensora_" class="official-link" target="_blank" rel="noopener noreferrer">
                    <div class="link-image-placeholder" aria-label="TikTok">TikTok</div>
                    <span class="link-content">
                        <span class="link-name">TikTok</span>
                        <span class="link-description">ショート動画</span>
                    </span>
                </a>
                <!-- リンク追加用の雛形：このaタグ全体をコピーして、URL・画像・名前・説明を書き換えます。
                <a href="ここにURL" class="official-link" target="_blank" rel="noopener noreferrer">
                    <img src="ここに画像ファイル名" class="link-image" alt="サービス名">
                    <span class="link-content">
                        <span class="link-name">サービス名</span>
                        <span class="link-description">ここに短い説明を書きます</span>
                    </span>
                </a>
                -->
            </div>

            <!-- ここまで -->

        </div>
    </div>

    <footer class="site-footer">
        <a href="site-info.html">サイト情報・広告について</a>
        <span>R-18・18歳未満閲覧禁止</span>
        <span>アフィリエイト広告を含みます</span>
        <span>© 絵恋空 Official Site</span>
    </footer>

    <button class="back-to-top" type="button" aria-label="ページ上部へ戻る" title="ページ上部へ戻る">
        <span aria-hidden="true">↑</span>
    </button>
    <script src="back-to-top.js"></script>

</body>
</html>
